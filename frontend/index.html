<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi Movistar · Asistente de Recibos</title>
<style>
  :root {
    /* Misma paleta que el panel interno (dashboard.html) -- solo colores
       solidos, sin degradados, y sin morado/rosado/naranja. */
    --mov-navy: #0a1628;
    --mov-navy-2: #142033;
    --mov-blue: #019df4;
    --mov-blue-dark: #0177c2;
    --mov-cyan: #00aeef;
    --mov-black: #1a1a1a;
    --mov-gray: #6b7280;
    --mov-gray-light: #f3f4f6;
    --mov-border: #e5e7eb;
    --verde: #1fae5c;
    --verde-bg: #d7f5e3;
    --amarillo: #d97a00;
    --amarillo-bg: #fdf1cf;
    --chat-fondo: #eef2f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--chat-fondo);
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  .app {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(10,22,40,0.18);
    display: flex;
    flex-direction: column;
    height: 90vh;
    max-height: 820px;
    position: relative;
  }

  header {
    background: var(--mov-navy);
    color: white;
    padding: 16px 18px;
  }
  header .top-row { display: flex; justify-content: space-between; align-items: center; }
  header .brand { font-weight: 800; font-size: 18px; letter-spacing: .3px; }
  header .brand span { color: var(--mov-blue); }
  header .top-actions { display: flex; gap: 6px; }
  header .top-actions button {
    background: rgba(255,255,255,0.12); color: white; border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px; padding: 5px 10px; font-size: 11px; cursor: pointer;
  }
  .cliente-info { margin-top: 10px; font-size: 13px; opacity: .9; display: none; }
  .cliente-info .linea { opacity: .7; font-size: 11.5px; }
  .recibo-card {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 14px; padding: 12px 14px; margin-top: 12px; display: none;
  }
  .recibo-card .monto { font-size: 26px; font-weight: 800; }
  .recibo-card .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .badge-diff { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .badge-up { background: var(--amarillo-bg); color: var(--amarillo); }
  .badge-down { background: var(--verde-bg); color: var(--verde); }
  .badge-flat { background: #e4e8ee; color: #445; }

  /* ---------- Comparacion visual recibo anterior vs actual ---------- */
  .comparacion-visual { margin-top: 12px; display: none; }
  .comp-fila { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; }
  .comp-label { width: 50px; flex-shrink: 0; opacity: .85; }
  .comp-pista { flex: 1; background: rgba(255,255,255,0.18); border-radius: 999px; height: 10px; overflow: hidden; }
  .comp-relleno { height: 100%; border-radius: 999px; }
  .comp-relleno.anterior { background: rgba(255,255,255,0.6); }
  .comp-relleno.actual { background: var(--mov-cyan); }
  .comp-valor { width: 64px; text-align: right; flex-shrink: 0; font-weight: 700; font-size: 11px; }
  .comp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .comp-chip { background: rgba(255,255,255,0.16); border-radius: 999px; padding: 3px 9px; font-size: 10.5px; }

  .chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--chat-fondo); }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .msg.bot { background: var(--mov-gray-light); color: var(--mov-black); border-bottom-left-radius: 4px; align-self: flex-start; }
  .msg.user { background: var(--mov-blue); color: white; border-bottom-right-radius: 4px; align-self: flex-end; }
  .msg b { font-weight: 700; }
  .quick-actions { display: flex; flex-wrap: wrap; gap: 6px; align-self: flex-start; max-width: 90%; }
  .quick-actions button {
    background: white; border: 1px solid var(--mov-border); color: var(--mov-blue-dark);
    border-radius: 999px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
  }
  .quick-actions button:hover { background: var(--mov-gray-light); }

  form.composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--mov-border); background: white; }
  form.composer input { flex: 1; border: 1px solid var(--mov-border); border-radius: 999px; padding: 11px 16px; font-size: 14px; outline: none; }
  form.composer input:focus { border-color: var(--mov-blue); }
  form.composer button { background: var(--mov-blue); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  form.composer button:disabled { opacity: .5; cursor: default; }

  .typing { align-self: flex-start; color: var(--mov-gray); font-size: 12.5px; padding-left: 4px; }

  /* ---------- Tarjeta de derivacion a agente ---------- */
  .agente-card-msg {
    align-self: flex-start; max-width: 88%; background: white; border: 1px solid var(--mov-border);
    border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center;
    box-shadow: 0 2px 8px rgba(10,22,40,0.08);
  }
  .agente-card-msg .avatar-agente { font-size: 32px; width: 48px; height: 48px; border-radius: 50%; background: var(--mov-gray-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .agente-card-msg .nombre-agente { font-weight: 700; font-size: 14px; color: var(--mov-navy); }
  .agente-card-msg .area-agente { font-size: 12px; color: var(--mov-gray); margin-top: 1px; }
  .agente-card-msg .estado-agente { font-size: 11px; color: var(--verde); font-weight: 700; margin-top: 4px; display: flex; align-items: center; gap: 5px; }
  .agente-card-msg .estado-agente .punto { width: 7px; height: 7px; border-radius: 50%; background: var(--verde); display: inline-block; animation: pulso 1.4s infinite; }
  @keyframes pulso { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  /* ---------- Panel de demo ---------- */
  .demo-panel { position: absolute; inset: 0; background: rgba(10,22,40,0.55); display: none; align-items: flex-end; z-index: 10; }
  .demo-panel.abierto { display: flex; }
  .demo-sheet { background: white; width: 100%; border-radius: 20px 20px 0 0; padding: 18px; max-height: 75%; overflow-y: auto; }
  .demo-sheet h3 { margin: 0 0 4px; font-size: 15px; color: var(--mov-navy); }
  .demo-sheet p { margin: 0 0 14px; font-size: 12px; color: var(--mov-gray); }
  .demo-lista button { display: block; width: 100%; text-align: left; background: var(--mov-gray-light); border: none; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; cursor: pointer; color: var(--mov-black); }
  .demo-lista button:hover { background: #e4e8ee; }
  .demo-lista .tag { font-size: 10.5px; color: var(--mov-blue-dark); font-weight: 700; text-transform: uppercase; }
  .cerrar-demo { display: block; margin: 4px auto 0; background: none; border: none; color: var(--mov-gray); font-size: 12px; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top-row">
      <div class="brand">mi<span>Movistar</span></div>
      <div class="top-actions">
        <button id="btnDemo">🎬 demo</button>
        <button id="btnSalir" style="display:none">🔄 salir</button>
      </div>
    </div>
    <div class="cliente-info" id="clienteInfo">
      Hola, <b id="nombreCliente">…</b> 👋
      <div class="linea" id="lineaLabel"></div>
    </div>
    <div class="recibo-card" id="reciboCard">
      <div class="monto" id="montoActual">S/ 0.00</div>
      <div class="sub" id="reciboSub">Recibo actual</div>
      <div class="badge-diff" id="badgeDiff"></div>
      <div class="comparacion-visual" id="comparacionVisual">
        <div class="comp-fila">
          <span class="comp-label">Anterior</span>
          <div class="comp-pista"><div class="comp-relleno anterior" id="compBarraAnterior"></div></div>
          <span class="comp-valor" id="compValorAnterior">S/ 0.00</span>
        </div>
        <div class="comp-fila">
          <span class="comp-label">Actual</span>
          <div class="comp-pista"><div class="comp-relleno actual" id="compBarraActual"></div></div>
          <span class="comp-valor" id="compValorActual">S/ 0.00</span>
        </div>
        <div class="comp-chips" id="compChips"></div>
      </div>
    </div>
  </header>

  <div class="chat" id="chat"></div>

  <form class="composer" id="composer">
    <input id="input" type="text" placeholder="Escribe tu número de cuenta…" autocomplete="off" />
    <button type="submit">➤</button>
  </form>

  <div class="demo-panel" id="demoPanel">
    <div class="demo-sheet">
      <h3>Modo demo</h3>
      <p>Este panel es solo para la presentación: simula escribir el número de cuenta de distintos clientes de ejemplo, tal como lo escribirías tú mismo en el chat.</p>
      <div class="demo-lista" id="demoLista"></div>
      <button class="cerrar-demo" id="cerrarDemo">Cerrar</button>
    </div>
  </div>
</div>

<script>
const API = "/api";

// Maquina de estados de la conversacion (todo pasa DENTRO del chat, no hay
// pantallas de login separadas -- asi es como funciona el bot real de WhatsApp).
const ESTADOS = { SIN_IDENTIFICAR: "SIN_IDENTIFICAR", ESPERANDO_LINEA: "ESPERANDO_LINEA", LISTO: "LISTO" };
let estado = ESTADOS.SIN_IDENTIFICAR;

let cuentaActual = null;
let lineaActual = null;
let reciboActual = null;
let lineasPendientes = [];
let historialConversacion = []; // {role:"user"|"bot", content} -- para que Claude tenga contexto

const chatEl = document.getElementById("chat");
const clienteInfoEl = document.getElementById("clienteInfo");
const nombreClienteEl = document.getElementById("nombreCliente");
const lineaLabelEl = document.getElementById("lineaLabel");
const reciboCard = document.getElementById("reciboCard");
const montoActualEl = document.getElementById("montoActual");
const reciboSubEl = document.getElementById("reciboSub");
const badgeDiffEl = document.getElementById("badgeDiff");
const composer = document.getElementById("composer");
const input = document.getElementById("input");
const btnDemo = document.getElementById("btnDemo");
const btnSalir = document.getElementById("btnSalir");
const demoPanel = document.getElementById("demoPanel");
const demoLista = document.getElementById("demoLista");
const cerrarDemo = document.getElementById("cerrarDemo");

const ETIQUETAS_ESCENARIO = {
  prorrateo: "🧾 Prorrateo (línea nueva)",
  reconexion: "🔌 Reconexión por corte",
  fin_descuento: "🏷️ Fin de descuento",
  financiamiento: "📱 Cuota de equipo",
  multiservicio: "📶 Cuenta con varios servicios",
};
const ICONOS_SERVICIO = {
  "Línea Móvil": "📱", "Internet Hogar": "🌐", "Equipo/Router de Internet": "📡",
  "TV": "📺", "Línea Fija (Voz)": "☎️",
};
// Mismos tipos de causa que devuelve engine.js, en version corta para las
// "chips" de la comparacion visual (explicacion visual, no solo texto --
// pedido explicito de la ficha del desafio).
const ETIQUETAS_CAUSA_VISUAL = {
  prorrateo: { emoji: "🧾", texto: "Prorrateo" },
  reconexion: { emoji: "🔌", texto: "Reconexión" },
  fin_descuento: { emoji: "🏷️", texto: "Fin de descuento" },
  financiamiento: { emoji: "📱", texto: "Cuota de equipo" },
  cambio_plan: { emoji: "🔄", texto: "Cambio de plan" },
  nota_credito: { emoji: "💳", texto: "Nota crédito/débito" },
  otro: { emoji: "❓", texto: "Otro cargo" },
};

// Nombres ficticios solo para que la demo se sienta como un cliente real
// (los datos originales estan anonimizados: sin nombre, sin DNI, sin telefono)
const NOMBRES = ["Renzo", "Camila", "Diana", "Bruno", "Valeria", "Mario", "Andrea", "Jorge"];
function nombreParaCuenta(cuenta) {
  const n = parseInt(String(cuenta).slice(-2), 10) || 0;
  return NOMBRES[n % NOMBRES.length];
}

function normalizar(t) {
  return t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
}

function md(texto) {
  return texto
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/_(.+?)_/g, "<i>$1</i>")
    .replace(/\n- /g, "\n• ")
    .replace(/\n/g, "<br>");
}

function addMsg(texto, from) {
  const div = document.createElement("div");
  div.className = "msg " + from;
  div.innerHTML = md(texto);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

let typingEl = null;
function mostrarTyping() {
  typingEl = document.createElement("div");
  typingEl.className = "typing";
  typingEl.textContent = "Escribiendo…";
  chatEl.appendChild(typingEl);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function quitarTyping() {
  if (typingEl) { typingEl.remove(); typingEl = null; }
}

// Tarjeta visible de derivacion: se muestra cuando el bot deriva a un
// agente "fake" (roster simulado), para que quede claro CON QUIEN se le
// esta conectando, no solo un generico "te paso con un asesor".
function addAgentCard(agente) {
  const div = document.createElement("div");
  div.className = "agente-card-msg";
  div.innerHTML = `
    <div class="avatar-agente">${agente.avatar}</div>
    <div>
      <div class="nombre-agente">${agente.nombre}</div>
      <div class="area-agente">${agente.area}</div>
      <div class="estado-agente"><span class="punto"></span> Conectando con el agente…</div>
    </div>
  `;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

// Un instante despues de la tarjeta de derivacion, simula que el agente
// "fake" se une al chat: pasa la tarjeta a "Disponible" y manda su saludo
// de entrada como una burbuja aparte (el texto exacto lo decide el
// backend -- data.saludo_agente -- para que quede igual en el log de
// interacciones que ve el panel interno).
function simularSaludoAgente(agente, saludo, cardEl) {
  setTimeout(() => {
    mostrarTyping();
    setTimeout(() => {
      quitarTyping();
      if (cardEl) {
        const estadoEl = cardEl.querySelector(".estado-agente");
        if (estadoEl) estadoEl.innerHTML = '<span class="punto"></span> Disponible';
      }
      addMsg(`${agente.avatar} ${saludo}`, "bot");
    }, 900);
  }, 700);
}

// Muestra la respuesta del bot en varios mensajitos seguidos en vez de un
// solo bloque de texto -- se ve mas como una persona texteando (los
// prompts del backend separan las ideas con una linea en blanco a
// proposito para esto), igual que se hace por WhatsApp. Tope de 3
// mensajes: si el texto trae mas parrafos, los ultimos se juntan en el
// ultimo para no saturar el chat de burbujas.
const MAX_PARTES_WEB = 3;
async function mostrarRespuestaBot(texto) {
  let partes = texto.split(/\n\s*\n+/).map((p) => p.trim()).filter(Boolean);
  if (partes.length > MAX_PARTES_WEB) {
    partes = [...partes.slice(0, MAX_PARTES_WEB - 1), partes.slice(MAX_PARTES_WEB - 1).join("\n\n")];
  }
  if (!partes.length) partes = [texto];
  for (let i = 0; i < partes.length; i++) {
    if (i > 0) {
      await new Promise((r) => setTimeout(r, 450));
      mostrarTyping();
      await new Promise((r) => setTimeout(r, 500));
      quitarTyping();
    }
    addMsg(partes[i], "bot");
  }
}

function addQuickActions(acciones) {
  if (!acciones || !acciones.length) return;
  const labels = {
    ver_detalle: "📋 Ver detalle",
    ver_recibos_anteriores: "📜 Recibos anteriores",
    registrar_consulta: "📝 Registrar consulta",
    pagar: "💳 Pagar",
    hablar_con_asesor: "🧑‍💼 Hablar con asesor",
  };
  const mensajes = {
    pagar: "quiero pagar",
    hablar_con_asesor: "hablar con un asesor",
    ver_detalle: "ver el detalle de mi recibo",
    ver_recibos_anteriores: "quiero ver mis recibos anteriores",
    registrar_consulta: "quiero registrar mi consulta",
  };
  const visibles = acciones.filter(a => labels[a]);
  if (!visibles.length) return;
  const wrap = document.createElement("div");
  wrap.className = "quick-actions";
  visibles.forEach(a => {
    const btn = document.createElement("button");
    btn.textContent = labels[a];
    btn.onclick = () => enviarMensaje(mensajes[a]);
    wrap.appendChild(btn);
  });
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ---------- Punto de entrada unico: todo mensaje pasa por aca ----------
async function enviarMensaje(texto, silencioso) {
  if (!silencioso) addMsg(texto, "user");
  mostrarTyping();

  if (estado === ESTADOS.SIN_IDENTIFICAR) {
    await procesarIdentificacion(texto);
    return;
  }
  if (estado === ESTADOS.ESPERANDO_LINEA) {
    procesarSeleccionLinea(texto);
    return;
  }

  // estado LISTO: consulta normal contra el backend
  try {
    const res = await fetch(`${API}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cuenta: cuentaActual, recibo: reciboActual, linea: lineaActual, mensaje: texto,
        historial: historialConversacion.slice(-12),
      }),
    });
    const data = await res.json();
    quitarTyping();
    await mostrarRespuestaBot(data.respuesta);
    if (data.agente) {
      const cardEl = addAgentCard(data.agente);
      if (data.saludo_agente) simularSaludoAgente(data.agente, data.saludo_agente, cardEl);
    }
    addQuickActions(data.acciones);
    historialConversacion.push({ role: "user", content: texto }, { role: "bot", content: data.respuesta });
  } catch (e) {
    quitarTyping();
    addMsg("Ups, no pude conectarme al servidor. ¿Está corriendo el backend en el puerto 8000?", "bot");
  }
}

// ---------- Paso 1: el propio chat pide el numero de cuenta ----------
async function procesarIdentificacion(textoCrudo) {
  const cuenta = textoCrudo.replace(/\D/g, "");
  if (!cuenta) {
    quitarTyping();
    addMsg("Necesito tu número de cuenta (solo números) para poder ayudarte. ¿Me lo compartes?", "bot");
    return;
  }
  try {
    const res = await fetch(`${API}/identificar/${encodeURIComponent(cuenta)}`);
    quitarTyping();
    if (!res.ok) {
      addMsg(`No te encuentro como cliente Movistar con la cuenta **${cuenta}** 😕. ¿Puedes verificar el número?`, "bot");
      return;
    }
    const data = await res.json();
    cuentaActual = cuenta;
    actualizarHeaderIdentificado(cuenta);

    if (data.lineas.length > 1) {
      lineasPendientes = data.lineas;
      estado = ESTADOS.ESPERANDO_LINEA;
      const listado = data.lineas.map((l, i) => `${i + 1}️⃣ ${ICONOS_SERVICIO[l.etiqueta] || "📶"} ${l.etiqueta}`).join("\n");
      addMsg(`¡Perfecto, ${nombreParaCuenta(cuenta)}! Tu cuenta tiene ${data.lineas.length} servicios:\n\n${listado}\n\n¿Sobre cuál quieres consultar? (responde con el número o el nombre)`, "bot");
    } else {
      lineaActual = data.lineas[0] ? data.lineas[0].anexo : null;
      await completarIdentificacion();
    }
  } catch (e) {
    quitarTyping();
    addMsg("No pude conectarme al servidor. ¿Está corriendo el backend en el puerto 8000?", "bot");
  }
}

// ---------- Paso 2 (solo si aplica): elegir el servicio ----------
function procesarSeleccionLinea(textoCrudo) {
  quitarTyping();
  const t = normalizar(textoCrudo);
  let elegida = null;

  const num = parseInt(t, 10);
  if (!isNaN(num) && lineasPendientes[num - 1]) elegida = lineasPendientes[num - 1];

  if (!elegida) {
    elegida = lineasPendientes.find(l => {
      const et = normalizar(l.etiqueta);
      return et.includes(t) || t.split(" ").some(p => p.length > 3 && et.includes(p));
    });
  }

  if (!elegida) {
    addMsg("No identifiqué cuál elegiste 🤔. Escribe el número de la lista o el nombre del servicio.", "bot");
    return;
  }

  lineaActual = elegida.anexo;
  completarIdentificacion();
}

// ---------- Paso 3: ya identificado, cargar recibo y responder ----------
async function completarIdentificacion() {
  estado = ESTADOS.LISTO;
  input.placeholder = "Escribe tu pregunta, ej: ¿por qué subió?";
  await cargarReciboCard();
  enviarMensaje("¿por qué varió mi recibo?", true);
}

function actualizarHeaderIdentificado(cuenta) {
  nombreClienteEl.textContent = nombreParaCuenta(cuenta);
  lineaLabelEl.textContent = `Cuenta •••${String(cuenta).slice(-4)}`;
  clienteInfoEl.style.display = "block";
  btnSalir.style.display = "inline-block";
}

async function cargarReciboCard() {
  try {
    const qs = lineaActual ? `?linea=${encodeURIComponent(lineaActual)}` : "";
    const res = await fetch(`${API}/recibo/${cuentaActual}${qs}`);
    const diag = await res.json();
    reciboActual = diag.recibo_actual;
    reciboCard.style.display = "block";
    montoActualEl.textContent = `S/ ${diag.total_actual.toFixed(2)}`;
    reciboSubEl.textContent = `Recibo ${diag.recibo_actual}`;
    const diff = diag.diferencia;
    badgeDiffEl.className = "badge-diff " + (diff > 0.5 ? "badge-up" : diff < -0.5 ? "badge-down" : "badge-flat");
    badgeDiffEl.textContent = diff > 0.5 ? `↑ S/ ${diff.toFixed(2)} más` : diff < -0.5 ? `↓ S/ ${Math.abs(diff).toFixed(2)} menos` : "Sin variación";
    pintarComparacionVisual(diag);
  } catch (e) {
    reciboCard.style.display = "none";
  }
}

// Comparacion visual (barras) del recibo anterior vs el actual, mas chips
// de las causas detectadas -- para que la explicacion no sea solo texto.
// Si es el primer recibo del cliente (no hay uno previo con que comparar),
// simplemente no se muestra: no hay nada que graficar todavia.
function pintarComparacionVisual(diag) {
  const wrap = document.getElementById("comparacionVisual");
  const previo = diag.total_previo || 0;
  const actual = diag.total_actual || 0;
  if (!previo) { wrap.style.display = "none"; return; }
  wrap.style.display = "block";

  const max = Math.max(previo, actual, 1);
  document.getElementById("compBarraAnterior").style.width = `${Math.max(4, (previo / max) * 100)}%`;
  document.getElementById("compBarraActual").style.width = `${Math.max(4, (actual / max) * 100)}%`;
  document.getElementById("compValorAnterior").textContent = `S/ ${previo.toFixed(2)}`;
  document.getElementById("compValorActual").textContent = `S/ ${actual.toFixed(2)}`;

  const chipsEl = document.getElementById("compChips");
  const causas = diag.causas || [];
  chipsEl.innerHTML = causas.map((c) => {
    const meta = ETIQUETAS_CAUSA_VISUAL[c.tipo] || { emoji: "🔎", texto: c.tipo };
    const monto = typeof c.monto === "number" && Math.abs(c.monto) >= 0.01 ? ` · S/ ${Math.abs(c.monto).toFixed(2)}` : "";
    return `<span class="comp-chip">${meta.emoji} ${meta.texto}${monto}</span>`;
  }).join("");
}

// ---------- Reiniciar sesion (boton "salir" o al cambiar de cuenta demo) ----------
function reiniciarSesion() {
  estado = ESTADOS.SIN_IDENTIFICAR;
  cuentaActual = null; lineaActual = null; reciboActual = null; lineasPendientes = []; historialConversacion = [];
  clienteInfoEl.style.display = "none";
  reciboCard.style.display = "none";
  btnSalir.style.display = "none";
  input.placeholder = "Escribe tu número de cuenta…";
  chatEl.innerHTML = "";
  addMsg("¡Hola! 👋 Soy Lucía Explica, tu asistente de facturación Movistar. Para comenzar, cuéntame tu número de cuenta.", "bot");
}

btnSalir.addEventListener("click", reiniciarSesion);

composer.addEventListener("submit", (e) => {
  e.preventDefault();
  const texto = input.value.trim();
  if (!texto) return;
  input.value = "";
  enviarMensaje(texto);
});

// ---------- Panel de demo: simula escribir el numero de cuenta en el chat ----------
async function cargarCasosDemo() {
  const res = await fetch(`${API}/casos-demo`);
  const data = await res.json();
  demoLista.innerHTML = "";
  Object.entries(data).forEach(([tipo, items]) => {
    items.forEach(item => {
      const btn = document.createElement("button");
      btn.innerHTML = `<span class="tag">${ETIQUETAS_ESCENARIO[tipo] || tipo}</span><br>Cuenta ${item.cuenta}`;
      btn.onclick = () => {
        cerrarPanelDemo();
        reiniciarSesion();
        enviarMensaje(String(item.cuenta));
      };
      demoLista.appendChild(btn);
    });
  });
}
function abrirPanelDemo() { demoPanel.classList.add("abierto"); }
function cerrarPanelDemo() { demoPanel.classList.remove("abierto"); }
btnDemo.addEventListener("click", abrirPanelDemo);
cerrarDemo.addEventListener("click", cerrarPanelDemo);
demoPanel.addEventListener("click", (e) => { if (e.target === demoPanel) cerrarPanelDemo(); });

reiniciarSesion();
cargarCasosDemo();
</script>
