<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi Movistar · Asistente de Recibos</title>
<style>
  :root {
    --azul: #0a2540;
    --azul-claro: #0f3460;
    --naranja: #ff6a00;
    --gris-fondo: #eef1f5;
    --gris-burbuja: #f0f2f5;
    --verde: #1fae5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--gris-fondo);
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  .app {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(10,37,64,0.18);
    display: flex;
    flex-direction: column;
    height: 90vh;
    max-height: 820px;
    position: relative;
  }

  header {
    background: linear-gradient(135deg, var(--azul), var(--azul-claro));
    color: white;
    padding: 16px 18px;
  }
  header .top-row { display: flex; justify-content: space-between; align-items: center; }
  header .brand { font-weight: 800; font-size: 18px; letter-spacing: .3px; }
  header .brand span { color: var(--naranja); }
  header .top-actions { display: flex; gap: 6px; }
  header .top-actions button {
    background: rgba(255,255,255,0.12); color: white; border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px; padding: 5px 10px; font-size: 11px; cursor: pointer;
  }
  .cliente-info { margin-top: 10px; font-size: 13px; opacity: .9; display: none; }
  .cliente-info .linea { opacity: .7; font-size: 11.5px; }
  .recibo-card {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 14px; padding: 12px 14px; margin-top: 12px; display: none;
  }
  .recibo-card .monto { font-size: 26px; font-weight: 800; }
  .recibo-card .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .badge-diff { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .badge-up { background: #ffe1cc; color: #b3450a; }
  .badge-down { background: #d7f5e3; color: #0d7a3f; }
  .badge-flat { background: #e4e8ee; color: #445; }

  .chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--gris-fondo); }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .msg.bot { background: var(--gris-burbuja); color: #1b1f27; border-bottom-left-radius: 4px; align-self: flex-start; }
  .msg.user { background: var(--azul); color: white; border-bottom-right-radius: 4px; align-self: flex-end; }
  .msg b { font-weight: 700; }
  .quick-actions { display: flex; flex-wrap: wrap; gap: 6px; align-self: flex-start; max-width: 90%; }
  .quick-actions button {
    background: white; border: 1px solid #d8dde5; color: var(--azul);
    border-radius: 999px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
  }
  .quick-actions button:hover { background: #e9edf3; }

  form.composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e4e8ee; background: white; }
  form.composer input { flex: 1; border: 1px solid #d8dde5; border-radius: 999px; padding: 11px 16px; font-size: 14px; outline: none; }
  form.composer input:focus { border-color: var(--azul); }
  form.composer button { background: var(--naranja); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  form.composer button:disabled { opacity: .5; cursor: default; }

  .typing { align-self: flex-start; color: #8a93a3; font-size: 12.5px; padding-left: 4px; }

  /* ---------- Panel de demo ---------- */
  .demo-panel { position: absolute; inset: 0; background: rgba(10,37,64,0.55); display: none; align-items: flex-end; z-index: 10; }
  .demo-panel.abierto { display: flex; }
  .demo-sheet { background: white; width: 100%; border-radius: 20px 20px 0 0; padding: 18px; max-height: 75%; overflow-y: auto; }
  .demo-sheet h3 { margin: 0 0 4px; font-size: 15px; color: var(--azul); }
  .demo-sheet p { margin: 0 0 14px; font-size: 12px; color: #667; }
  .demo-lista button { display: block; width: 100%; text-align: left; background: var(--gris-burbuja); border: none; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; cursor: pointer; color: #1b1f27; }
  .demo-lista button:hover { background: #e4e8ee; }
  .demo-lista .tag { font-size: 10.5px; color: var(--naranja); font-weight: 700; text-transform: uppercase; }
  .cerrar-demo { display: block; margin: 4px auto 0; background: none; border: none; color: #667; font-size: 12px; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top-row">
      <div class="brand">mi<span>Movistar</span></div>
      <div class="top-actions">
        <button id="btnDemo">🎬 demo</button>
        <button id="btnSalir" style="display:none">🔄 salir</button>
      </div>
    </div>
    <div class="cliente-info" id="clienteInfo">
      Hola, <b id="nombreCliente">…</b> 👋
      <div class="linea" id="lineaLabel"></div>
    </div>
    <div class="recibo-card" id="reciboCard">
      <div class="monto" id="montoActual">S/ 0.00</div>
      <div class="sub" id="reciboSub">Recibo actual</div>
      <div class="badge-diff" id="badgeDiff"></div>
    </div>
  </header>

  <div class="chat" id="chat"></div>

  <form class="composer" id="composer">
    <input id="input" type="text" placeholder="Escribe tu número de cuenta…" autocomplete="off" />
    <button type="submit">➤</button>
  </form>

  <div class="demo-panel" id="demoPanel">
    <div class="demo-sheet">
      <h3>Modo demo</h3>
      <p>Este panel es solo para la presentación: simula escribir el número de cuenta de distintos clientes de ejemplo, tal como lo escribirías tú mismo en el chat.</p>
      <div class="demo-lista" id="demoLista"></div>
      <button class="cerrar-demo" id="cerrarDemo">Cerrar</button>
    </div>
  </div>
</div>

<script>
const API = "http://localhost:8000/api";

// Maquina de estados de la conversacion (todo pasa DENTRO del chat, no hay
// pantallas de login separadas -- asi es como funciona el bot real de WhatsApp).
const ESTADOS = { SIN_IDENTIFICAR: "SIN_IDENTIFICAR", ESPERANDO_LINEA: "ESPERANDO_LINEA", LISTO: "LISTO" };
let estado = ESTADOS.SIN_IDENTIFICAR;

let cuentaActual = null;
let lineaActual = null;
let reciboActual = null;
let lineasPendientes = [];

const chatEl = document.getElementById("chat");
const clienteInfoEl = document.getElementById("clienteInfo");
const nombreClienteEl = document.getElementById("nombreCliente");
const lineaLabelEl = document.getElementById("lineaLabel");
const reciboCard = document.getElementById("reciboCard");
const montoActualEl = document.getElementById("montoActual");
const reciboSubEl = document.getElementById("reciboSub");
const badgeDiffEl = document.getElementById("badgeDiff");
const composer = document.getElementById("composer");
const input = document.getElementById("input");
const btnDemo = document.getElementById("btnDemo");
const btnSalir = document.getElementById("btnSalir");
const demoPanel = document.getElementById("demoPanel");
const demoLista = document.getElementById("demoLista");
const cerrarDemo = document.getElementById("cerrarDemo");

const ETIQUETAS_ESCENARIO = {
  prorrateo: "🧾 Prorrateo (línea nueva)",
  reconexion: "🔌 Reconexión por corte",
  fin_descuento: "🏷️ Fin de descuento",
  financiamiento: "📱 Cuota de equipo",
  multiservicio: "📶 Cuenta con varios servicios",
};
const ICONOS_SERVICIO = {
  "Línea Móvil": "📱", "Internet Hogar": "🌐", "Equipo/Router de Internet": "📡",
  "TV": "📺", "Línea Fija (Voz)": "☎️",
};

// Nombres ficticios solo para que la demo se sienta como un cliente real
// (los datos originales estan anonimizados: sin nombre, sin DNI, sin telefono)
const NOMBRES = ["Renzo", "Camila", "Diana", "Bruno", "Valeria", "Mario", "Andrea", "Jorge"];
function nombreParaCuenta(cuenta) {
  const n = parseInt(String(cuenta).slice(-2), 10) || 0;
  return NOMBRES[n % NOMBRES.length];
}

function normalizar(t) {
  return t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
}

function md(texto) {
  return texto
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/_(.+?)_/g, "<i>$1</i>")
    .replace(/\n- /g, "\n• ")
    .replace(/\n/g, "<br>");
}

function addMsg(texto, from) {
  const div = document.createElement("div");
  div.className = "msg " + from;
  div.innerHTML = md(texto);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

let typingEl = null;
function mostrarTyping() {
  typingEl = document.createElement("div");
  typingEl.className = "typing";
  typingEl.textContent = "Escribiendo…";
  chatEl.appendChild(typingEl);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function quitarTyping() {
  if (typingEl) { typingEl.remove(); typingEl = null; }
}

function addQuickActions(acciones) {
  if (!acciones || !acciones.length) return;
  const labels = { ver_detalle: "📋 Ver detalle", pagar: "💳 Pagar", hablar_con_asesor: "🧑‍💼 Hablar con asesor" };
  const visibles = acciones.filter(a => labels[a]);
  if (!visibles.length) return;
  const wrap = document.createElement("div");
  wrap.className = "quick-actions";
  visibles.forEach(a => {
    const btn = document.createElement("button");
    btn.textContent = labels[a];
    btn.onclick = () => enviarMensaje(
      a === "pagar" ? "quiero pagar" : a === "hablar_con_asesor" ? "hablar con un asesor" : "ver el detalle de mi recibo"
    );
    wrap.appendChild(btn);
  });
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ---------- Punto de entrada unico: todo mensaje pasa por aca ----------
async function enviarMensaje(texto, silencioso) {
  if (!silencioso) addMsg(texto, "user");
  mostrarTyping();

  if (estado === ESTADOS.SIN_IDENTIFICAR) {
    await procesarIdentificacion(texto);
    return;
  }
  if (estado === ESTADOS.ESPERANDO_LINEA) {
    procesarSeleccionLinea(texto);
    return;
  }

  // estado LISTO: consulta normal contra el backend
  try {
    const res = await fetch(`${API}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cuenta: cuentaActual, recibo: reciboActual, linea: lineaActual, mensaje: texto }),
    });
    const data = await res.json();
    quitarTyping();
    addMsg(data.respuesta, "bot");
    addQuickActions(data.acciones);
  } catch (e) {
    quitarTyping();
    addMsg("Ups, no pude conectarme al servidor. ¿Está corriendo el backend en el puerto 8000?", "bot");
  }
}

// ---------- Paso 1: el propio chat pide el numero de cuenta ----------
async function procesarIdentificacion(textoCrudo) {
  const cuenta = textoCrudo.replace(/\D/g, "");
  if (!cuenta) {
    quitarTyping();
    addMsg("Necesito tu número de cuenta (solo números) para poder ayudarte. ¿Me lo compartes?", "bot");
    return;
  }
  try {
    const res = await fetch(`${API}/identificar/${encodeURIComponent(cuenta)}`);
    quitarTyping();
    if (!res.ok) {
      addMsg(`No te encuentro como cliente Movistar con la cuenta **${cuenta}** 😕. ¿Puedes verificar el número?`, "bot");
      return;
    }
    const data = await res.json();
    cuentaActual = cuenta;
    actualizarHeaderIdentificado(cuenta);

    if (data.lineas.length > 1) {
      lineasPendientes = data.lineas;
      estado = ESTADOS.ESPERANDO_LINEA;
      const listado = data.lineas.map((l, i) => `${i + 1}️⃣ ${ICONOS_SERVICIO[l.etiqueta] || "📶"} ${l.etiqueta}`).join("\n");
      addMsg(`¡Perfecto, ${nombreParaCuenta(cuenta)}! Tu cuenta tiene ${data.lineas.length} servicios:\n\n${listado}\n\n¿Sobre cuál quieres consultar? (responde con el número o el nombre)`, "bot");
    } else {
      lineaActual = data.lineas[0] ? data.lineas[0].anexo : null;
      await completarIdentificacion();
    }
  } catch (e) {
    quitarTyping();
    addMsg("No pude conectarme al servidor. ¿Está corriendo el backend en el puerto 8000?", "bot");
  }
}

// ---------- Paso 2 (solo si aplica): elegir el servicio ----------
function procesarSeleccionLinea(textoCrudo) {
  quitarTyping();
  const t = normalizar(textoCrudo);
  let elegida = null;

  const num = parseInt(t, 10);
  if (!isNaN(num) && lineasPendientes[num - 1]) elegida = lineasPendientes[num - 1];

  if (!elegida) {
    elegida = lineasPendientes.find(l => {
      const et = normalizar(l.etiqueta);
      return et.includes(t) || t.split(" ").some(p => p.length > 3 && et.includes(p));
    });
  }

  if (!elegida) {
    addMsg("No identifiqué cuál elegiste 🤔. Escribe el número de la lista o el nombre del servicio.", "bot");
    return;
  }

  lineaActual = elegida.anexo;
  completarIdentificacion();
}

// ---------- Paso 3: ya identificado, cargar recibo y responder ----------
async function completarIdentificacion() {
  estado = ESTADOS.LISTO;
  input.placeholder = "Escribe tu pregunta, ej: ¿por qué subió?";
  await cargarReciboCard();
  enviarMensaje("¿por qué varió mi recibo?", true);
}

function actualizarHeaderIdentificado(cuenta) {
  nombreClienteEl.textContent = nombreParaCuenta(cuenta);
  lineaLabelEl.textContent = `Cuenta •••${String(cuenta).slice(-4)}`;
  clienteInfoEl.style.display = "block";
  btnSalir.style.display = "inline-block";
}

async function cargarReciboCard() {
  try {
    const qs = lineaActual ? `?linea=${encodeURIComponent(lineaActual)}` : "";
    const res = await fetch(`${API}/recibo/${cuentaActual}${qs}`);
    const diag = await res.json();
    reciboActual = diag.recibo_actual;
    reciboCard.style.display = "block";
    montoActualEl.textContent = `S/ ${diag.total_actual.toFixed(2)}`;
    reciboSubEl.textContent = `Recibo ${diag.recibo_actual}`;
    const diff = diag.diferencia;
    badgeDiffEl.className = "badge-diff " + (diff > 0.5 ? "badge-up" : diff < -0.5 ? "badge-down" : "badge-flat");
    badgeDiffEl.textContent = diff > 0.5 ? `↑ S/ ${diff.toFixed(2)} más` : diff < -0.5 ? `↓ S/ ${Math.abs(diff).toFixed(2)} menos` : "Sin variación";
  } catch (e) {
    reciboCard.style.display = "none";
  }
}

// ---------- Reiniciar sesion (boton "salir" o al cambiar de cuenta demo) ----------
function reiniciarSesion() {
  estado = ESTADOS.SIN_IDENTIFICAR;
  cuentaActual = null; lineaActual = null; reciboActual = null; lineasPendientes = [];
  clienteInfoEl.style.display = "none";
  reciboCard.style.display = "none";
  btnSalir.style.display = "none";
  input.placeholder = "Escribe tu número de cuenta…";
  chatEl.innerHTML = "";
  addMsg("¡Hola! 👋 Soy tu asistente de facturación Movistar. Para comenzar, cuéntame tu número de cuenta.", "bot");
}

btnSalir.addEventListener("click", reiniciarSesion);

composer.addEventListener("submit", (e) => {
  e.preventDefault();
  const texto = input.value.trim();
  if (!texto) return;
  input.value = "";
  enviarMensaje(texto);
});

// ---------- Panel de demo: simula escribir el numero de cuenta en el chat ----------
async function cargarCasosDemo() {
  const res = await fetch(`${API}/casos-demo`);
  const data = await res.json();
  demoLista.innerHTML = "";
  Object.entries(data).forEach(([tipo, items]) => {
    items.forEach(item => {
      const btn = document.createElement("button");
      btn.innerHTML = `<span class="tag">${ETIQUETAS_ESCENARIO[tipo] || tipo}</span><br>Cuenta ${item.cuenta}`;
      btn.onclick = () => {
        cerrarPanelDemo();
        reiniciarSesion();
        enviarMensaje(String(item.cuenta));
      };
      demoLista.appendChild(btn);
    });
  });
}
function abrirPanelDemo() { demoPanel.classList.add("abierto"); }
function cerrarPanelDemo() { demoPanel.classList.remove("abierto"); }
btnDemo.addEventListener("click", abrirPanelDemo);
cerrarDemo.addEventListener("click", cerrarPanelDemo);
demoPanel.addEventListener("click", (e) => { if (e.target === demoPanel) cerrarPanelDemo(); });

reiniciarSesion();
cargarCasosDemo();
</script>
</body>
</html>
